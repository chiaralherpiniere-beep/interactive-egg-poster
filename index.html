<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIB Ornithology Egg Poster</title>
<style>
:root{--card:#ffffff;--text:#202020;--muted:#5d5d5d;--accent:#d81b60}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,Helvetica,sans-serif}
.viewport{position:fixed;inset:0;overflow:hidden;touch-action:none;background:#111}
.wrap{position:absolute;left:50%;top:0;width:min(100vw,1000px);line-height:0;transform-origin:0 0;will-change:transform}
#poster{display:block;width:100%;height:auto}
.hotspot{
  position:absolute;transform:translate(-50%,-50%);border:0;border-radius:50%;
  background:transparent;cursor:pointer;padding:0;line-height:normal;
  -webkit-tap-highlight-color:transparent;
}
.hotspot:hover,.hotspot:focus-visible{
  outline:2px solid rgba(255,255,255,.92);
  background:rgba(255,255,255,.16);
}
#hoverTip{
  position:fixed;z-index:20;display:none;pointer-events:none;background:#111;color:#fff;
  padding:7px 9px;border-radius:6px;font-size:14px;line-height:1.25;max-width:260px;
  box-shadow:0 3px 12px rgba(0,0,0,.25)
}
#card{
  position:fixed;z-index:30;display:none;width:min(270px,calc(100vw - 28px));
  box-sizing:border-box;background:var(--card);color:var(--text);border-radius:12px;
  padding:12px 12px 11px;box-shadow:0 10px 35px rgba(0,0,0,.34);line-height:1.25;
}
#card .common{font-size:16px;font-weight:700;margin:0 24px 2px 0}
#card .scientific{font-size:14px;font-style:italic;color:var(--muted);margin-bottom:8px}
#card .unknown{font-size:15px;color:var(--muted);margin-bottom:2px}
#learn{
  display:inline-block;text-decoration:none;background:var(--accent);color:#fff;
  padding:5px 8px;border-radius:7px;font-weight:600;font-size:12px
}
#close{
  position:absolute;right:9px;top:8px;border:0;background:transparent;
  font-size:24px;line-height:1;cursor:pointer;color:#555;padding:2px 6px
}
@media (hover:none){
  .hotspot:hover{outline:none;background:transparent}
}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <img id="poster" src="poster.PNG" alt="Ornithology Hamburg egg poster">
</div>

<div id="hoverTip"></div>

<div id="card" role="dialog" aria-live="polite">
  <button id="close" aria-label="Close">×</button>
  <div id="common" class="common"></div>
  <div id="scientific" class="scientific"></div>
  <a id="learn" href="#" target="_blank" rel="noopener">Learn more →</a>
  <div id="unknown" class="unknown" style="display:none">No external species page is available for this specimen.</div>
</div>

<script>
const viewport=document.getElementById('viewport');
const wrap=document.getElementById('wrap');
const hoverTip=document.getElementById('hoverTip');
const card=document.getElementById('card');
const commonEl=document.getElementById('common');
const sciEl=document.getElementById('scientific');
const learn=document.getElementById('learn');
const unknown=document.getElementById('unknown');
const closeBtn=document.getElementById('close');

function hoverLabel(h){
  return h.common ? `${h.common} — ${h.scientific}` : h.scientific;
}

function placeCard(clientX,clientY){
  card.style.display='block';
  const pad=12;
  const r=card.getBoundingClientRect();
  let left=clientX+14, top=clientY+14;
  if(left+r.width>window.innerWidth-pad) left=clientX-r.width-14;
  if(top+r.height>window.innerHeight-pad) top=clientY-r.height-14;
  left=Math.max(pad,Math.min(left,window.innerWidth-r.width-pad));
  top=Math.max(pad,Math.min(top,window.innerHeight-r.height-pad));
  card.style.left=left+'px'; card.style.top=top+'px';
}

function openCard(h,e){
  commonEl.textContent=h.common || (h.scientific==="Species unknown" ? "Unidentified specimen" : "");
  sciEl.textContent=h.scientific==="Species unknown" ? "" : h.scientific;
  sciEl.style.display=sciEl.textContent ? 'block' : 'none';

  if(h.url){
    learn.href=h.url;
    learn.style.display='inline-block';
    unknown.style.display='none';
  } else {
    learn.style.display='none';
    unknown.style.display='block';
  }
  hoverTip.style.display='none';
  placeCard(e.clientX,e.clientY);
}

fetch('hotspots.json').then(r=>r.json()).then(items=>{
  items.forEach(h=>{
    const b=document.createElement('button');
    b.className='hotspot';
    b.type='button';
    b.setAttribute('aria-label',hoverLabel(h));
    b.style.left=h.x+'%';
    b.style.top=h.y+'%';
    b.style.width=(h.r*2)+'%';
    b.style.aspectRatio='1';

    b.addEventListener('mousemove',e=>{
      if(matchMedia('(hover:hover)').matches){
        hoverTip.textContent=hoverLabel(h);
        hoverTip.style.display='block';
        hoverTip.style.left=(e.clientX+12)+'px';
        hoverTip.style.top=(e.clientY+12)+'px';
      }
    });
    b.addEventListener('mouseleave',()=>hoverTip.style.display='none');
    b.addEventListener('click',e=>{
      e.stopPropagation();
      openCard(h,e);
    });
    wrap.appendChild(b);
  });
});

closeBtn.addEventListener('click',()=>card.style.display='none');
document.addEventListener('click',e=>{
  if(!card.contains(e.target)) card.style.display='none';
});

// Poster-only zoom/pan: the species card is outside the transformed poster,
// so its on-screen size stays constant.
let scale=1, tx=0, ty=0;
const MIN_SCALE=1, MAX_SCALE=5;
const pointers=new Map();
let pinchDist=null, pinchMid=null;

function bw(){ return Math.min(window.innerWidth,1000); }
function left0(){ return (window.innerWidth-bw())/2; }

function clamp(){
  const sw=bw()*scale, sh=(wrap.offsetHeight||window.innerHeight)*scale;
  tx=Math.max(Math.min(0,window.innerWidth-sw-left0()),Math.min(tx,Math.max(0,-left0())));
  ty=Math.max(Math.min(0,window.innerHeight-sh),Math.min(ty,0));
}
function apply(){
  clamp();
  wrap.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
}
function zoomAt(x,y,s){
  s=Math.max(MIN_SCALE,Math.min(MAX_SCALE,s));
  const px=(x-left0()-tx)/scale, py=(y-ty)/scale;
  tx=x-left0()-px*s; ty=y-py*s; scale=s; apply();
}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});

viewport.addEventListener('pointerdown',e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  viewport.setPointerCapture(e.pointerId);
  if(pointers.size===2){
    const [a,b]=[...pointers.values()];
    pinchDist=dist(a,b); pinchMid=mid(a,b);
  }
});
viewport.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId)) return;
  const old=pointers.get(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1 && scale>1){
    tx+=e.clientX-old.x; ty+=e.clientY-old.y; apply();
  } else if(pointers.size===2){
    const [a,b]=[...pointers.values()], d=dist(a,b), m=mid(a,b);
    if(pinchDist){
      tx+=m.x-pinchMid.x; ty+=m.y-pinchMid.y; apply();
      zoomAt(m.x,m.y,scale*(d/pinchDist));
    }
    pinchDist=d; pinchMid=m;
  }
});
function end(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2){pinchDist=null;pinchMid=null;}
}
viewport.addEventListener('pointerup',end);
viewport.addEventListener('pointercancel',end);

viewport.addEventListener('wheel',e=>{
  e.preventDefault();
  zoomAt(e.clientX,e.clientY,scale*Math.exp(-e.deltaY*0.002));
},{passive:false});

window.addEventListener('resize',()=>{
  card.style.display='none';
  if(scale===1){tx=0;ty=0;}
  apply();
});
document.getElementById('poster').addEventListener('load',apply);
apply();

</script>
</body>
</html>
